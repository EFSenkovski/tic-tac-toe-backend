services:
  postgres:
    image: postgres:17-alpine
    container_name: tic-tac-toe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: tictactoe
      POSTGRES_USER: tictactoe
      POSTGRES_PASSWORD: tictactoe
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tictactoe -d tictactoe"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
